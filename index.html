<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Gift Cards Hub</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Fonts: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <!-- FontAwesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <style>
    body {
      font-family: 'Inter', sans-serif;
      background: #f1f5f9;
      color: #0f172a;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
    .glass-bar {
      background: rgba(255, 255, 255, 0.92);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid rgba(0, 0, 0, 0.08);
    }
    .glow-btn {
      background: linear-gradient(180deg, #1d6bf3 0%, #1555c9 100%);
      box-shadow: 0 10px 25px -4px rgba(29, 107, 243, 0.4);
    }
    .glow-btn:active {
      transform: scale(0.98);
    }
    .card-wrap {
      transition: transform 0.18s ease, box-shadow 0.18s ease;
    }
    .card-wrap:active {
      transform: scale(0.96);
    }
  </style>
</head>
<body class="min-h-screen flex items-center justify-center p-0 sm:p-4">

  <!-- Mobile Frame Container (Світлий білий інтерфейс) -->
  <div class="w-full max-w-sm h-[100dvh] sm:h-[780px] bg-white sm:rounded-[38px] shadow-2xl sm:border border-slate-200/80 flex flex-col relative overflow-hidden">

    <!-- SCREEN 1: CATALOG (Головний каталог карток) -->
    <div id="catalogScreen" class="flex-1 flex flex-col h-full overflow-hidden bg-slate-50/50">
      <!-- Верхній бар -->
      <header class="pt-5 pb-2 px-5 flex items-center justify-between z-10 shrink-0">
        <button class="w-9 h-9 rounded-full bg-white shadow-sm border border-slate-200/80 flex items-center justify-center text-slate-700 hover:bg-slate-100 transition active:scale-95">
          <i class="fa-solid fa-chevron-left text-sm"></i>
        </button>
        <div class="flex items-center space-x-2">
          <i class="fa-solid fa-gift text-blue-600"></i>
          <h1 class="text-lg font-bold text-slate-900 tracking-tight">Gift Cards</h1>
        </div>
        <button class="w-9 h-9 rounded-full bg-white shadow-sm border border-slate-200/80 flex items-center justify-center text-slate-700 hover:bg-slate-100 transition active:scale-95">
          <i class="fa-solid fa-sliders text-xs"></i>
        </button>
      </header>

      <!-- Категорії (All, Gaming, Entertainment, Shopping) -->
      <nav class="px-5 py-2 shrink-0">
        <div class="flex items-center space-x-2 overflow-x-auto no-scrollbar">
          <button onclick="filterCategory('All')" id="cat-All" class="cat-pill px-4 py-1.5 rounded-full text-xs font-semibold bg-blue-600 text-white shadow-sm">All</button>
          <button onclick="filterCategory('Gaming')" id="cat-Gaming" class="cat-pill px-4 py-1.5 rounded-full text-xs font-semibold bg-white text-slate-600 border border-slate-200/80 hover:bg-slate-100">Gaming</button>
          <button onclick="filterCategory('Entertainment')" id="cat-Entertainment" class="cat-pill px-4 py-1.5 rounded-full text-xs font-semibold bg-white text-slate-600 border border-slate-200/80 hover:bg-slate-100">Entertainment</button>
          <button onclick="filterCategory('Shopping')" id="cat-Shopping" class="cat-pill px-4 py-1.5 rounded-full text-xs font-semibold bg-white text-slate-600 border border-slate-200/80 hover:bg-slate-100">Shopping</button>
        </div>
      </nav>

      <!-- Сітка подарункових карток -->
      <main class="flex-1 overflow-y-auto px-4 py-2 pb-24">
        <div id="cardsGrid" class="grid grid-cols-2 gap-3.5">
          <!-- Генерується через JavaScript з наданих зображень -->
        </div>
      </main>
    </div>

    <!-- SCREEN 2: UNLOCK CODE (Білий екран розблокування з відео 0:01-0:04) -->
    <div id="unlockScreen" class="absolute inset-0 bg-white flex flex-col z-30 transition-transform duration-300 translate-x-full">
      <!-- Навігація екрану розблокування -->
      <div class="pt-5 pb-3 px-5 flex items-center justify-between">
        <button onclick="closeUnlockScreen()" class="w-9 h-9 rounded-full bg-slate-100 flex items-center justify-center text-slate-700 hover:bg-slate-200 transition active:scale-95">
          <i class="fa-solid fa-chevron-left text-sm"></i>
        </button>
        <span class="text-xs uppercase tracking-widest text-slate-400 font-bold">Digital Code</span>
        <div class="w-9"></div>
      </div>

      <!-- Центральний вміст (точно як у відео) -->
      <div class="flex-1 flex flex-col items-center justify-center px-6 text-center">
        <!-- Повноекранна картка із зображенням -->
        <div id="selectedCardPoster" class="w-56 h-80 rounded-2xl relative p-1 flex items-center justify-center mb-8 transition-transform duration-300">
          <!-- Картинка обраної картки -->
        </div>

        <!-- Поле коду: ****_****_****_**** як у відео -->
        <div id="codeDisplay" class="font-mono text-xl font-bold tracking-widest text-slate-900 mb-6 py-2 px-4 rounded-xl w-full max-w-xs">
          ****_****_****_****
        </div>

        <!-- Головна кнопка: Unlock last code -->
        <button id="btnUnlock" onclick="startUnlockSequence()" class="glow-btn w-full max-w-xs py-3.5 px-6 rounded-full text-white font-bold text-sm tracking-wide transition active:scale-95 flex items-center justify-center space-x-2">
          <span>Unlock last code</span>
        </button>
      </div>
    </div>

    <!-- BOTTOM NAVIGATION (Світла версія) -->
    <nav class="absolute bottom-3 left-4 right-4 h-14 rounded-2xl glass-bar shadow-lg shadow-slate-200/50 flex items-center justify-around px-2 z-20">
      <button class="flex flex-col items-center justify-center text-blue-600 w-12">
        <i class="fa-solid fa-house text-base"></i>
        <span class="text-[9px] font-semibold mt-0.5">Home</span>
      </button>
      <button class="flex flex-col items-center justify-center text-slate-400 hover:text-slate-600 w-12">
        <i class="fa-solid fa-bag-shopping text-base"></i>
        <span class="text-[9px] font-medium mt-0.5">Shop</span>
      </button>
      <!-- Центральна кнопка Redeem -->
      <button class="relative -top-2 w-11 h-11 rounded-full glow-btn text-white flex flex-col items-center justify-center active:scale-95 transition">
        <i class="fa-solid fa-gift text-lg"></i>
        <span class="text-[7px] font-black uppercase tracking-tighter">Redeem</span>
      </button>
      <button class="flex flex-col items-center justify-center text-slate-400 hover:text-slate-600 w-12">
        <i class="fa-solid fa-tags text-base"></i>
        <span class="text-[9px] font-medium mt-0.5">Deals</span>
      </button>
      <button class="flex flex-col items-center justify-center text-slate-400 hover:text-slate-600 w-12">
        <i class="fa-solid fa-heart text-base"></i>
        <span class="text-[9px] font-medium mt-0.5">Favorites</span>
      </button>
    </nav>

  </div>

  <!-- Notification Toast -->
  <div id="toast" class="fixed top-5 z-[100] -translate-y-20 opacity-0 transition-all duration-300 pointer-events-none px-4 py-2 rounded-full bg-slate-900 text-white text-xs font-semibold shadow-lg">
    Код скопійовано в буфер обміну!
  </div>

  <script>
    // Масив з наданими зображеннями карток
    const CARDS = [
      {
        id: 'roblox',
        title: 'ROBLOX',
        image: 'https://i.postimg.cc/dtj2hjDh/11.png',
        reward: '10.000 Robux',
        category: 'Gaming',
        brand: '@Roblox'
      },
      {
        id: 'fortnite',
        title: 'FORTNITE',
        image: 'https://i.postimg.cc/15rG8r45/2.png',
        reward: '13.500 V-Bucks',
        category: 'Gaming',
        brand: '@FortniteGame'
      },
      {
        id: 'itunes',
        title: 'iTunes',
        image: 'https://i.postimg.cc/m2yYPyhD/3.png',
        reward: '$50.00 Balance',
        category: 'Entertainment',
        brand: '@Apple'
      },
      {
        id: 'cashapp',
        title: 'Cash App',
        image: "https://i.postimg.cc/ZKx8Wx0n/4'.png",
        reward: '$100.00 Cash',
        category: 'Shopping',
        brand: '@CashApp'
      },
      {
        id: 'ebay',
        title: 'eBay',
        image: 'https://i.postimg.cc/sD4YM412/5.png',
        reward: '$75.00 Voucher',
        category: 'Shopping',
        brand: '@eBay'
      },
      {
        id: 'bestbuy',
        title: 'Best Buy',
        image: 'https://i.postimg.cc/FsVyYV17/6.png',
        reward: '$100.00 Tech Card',
        category: 'Shopping',
        brand: '@BestBuy'
      }
    ];

    let currentCard = CARDS[0];
    let selectedCategory = 'All';

    // Рендер каталогу з реальними зображеннями
    function renderCatalog() {
      const grid = document.getElementById('cardsGrid');
      grid.innerHTML = '';
      const list = selectedCategory === 'All' ? CARDS : CARDS.filter(c => c.category === selectedCategory);

      list.forEach(card => {
        const item = document.createElement('div');
        item.className = 'card-wrap cursor-pointer flex flex-col items-center justify-center';
        item.onclick = () => openUnlockScreen(card);
        item.innerHTML = `
          <div class="w-full rounded-2xl overflow-hidden bg-white p-1 drop-shadow-sm hover:drop-shadow-md transition">
            <img src="${card.image}" alt="${card.title}" class="w-full h-auto object-contain rounded-xl block" loading="lazy">
          </div>
        `;
        grid.appendChild(item);
      });
    }

    function filterCategory(cat) {
      selectedCategory = cat;
      document.querySelectorAll('.cat-pill').forEach(btn => {
        btn.className = 'cat-pill px-4 py-1.5 rounded-full text-xs font-semibold bg-white text-slate-600 border border-slate-200/80 hover:bg-slate-100';
      });
      document.getElementById(`cat-${cat}`).className = 'cat-pill px-4 py-1.5 rounded-full text-xs font-semibold bg-blue-600 text-white shadow-sm';
      renderCatalog();
    }

    // Відкриття екрану картки (білий фон з відео)
    function openUnlockScreen(card) {
      currentCard = card;
      document.getElementById('selectedCardPoster').innerHTML = `
        <img src="${card.image}" alt="${card.title}" class="w-full h-full object-contain drop-shadow-2xl rounded-2xl">
      `;
      const display = document.getElementById('codeDisplay');
      display.innerText = '****_****_****_****';
      display.className = 'font-mono text-xl font-bold tracking-widest text-slate-900 mb-6 py-2 px-4 rounded-xl w-full max-w-xs';
      
      const btn = document.getElementById('btnUnlock');
      btn.disabled = false;
      btn.onclick = startUnlockSequence;
      btn.className = 'glow-btn w-full max-w-xs py-3.5 px-6 rounded-full text-white font-bold text-sm tracking-wide transition active:scale-95 flex items-center justify-center space-x-2';
      btn.innerHTML = '<span>Unlock last code</span>';

      document.getElementById('unlockScreen').classList.remove('translate-x-full');
    }

    function closeUnlockScreen() {
      document.getElementById('unlockScreen').classList.add('translate-x-full');
    }

    // Процес розблокування (0:01 -> 0:04 з відео)
    function startUnlockSequence() {
      const btn = document.getElementById('btnUnlock');
      const display = document.getElementById('codeDisplay');
      btn.disabled = true;

      // Крок 1: часткове відкриття
      display.innerText = 'K7QF-ML1Z-*Y1*-****';
      display.className = 'font-mono text-xl font-bold tracking-widest text-blue-600 mb-6 py-2 px-4 rounded-xl w-full max-w-xs';

      // Крок 2: фінальне відкриття коду (без показу модалки)
      setTimeout(() => {
        const fullCode = 'K7QF-MZRA-9TWL-XPCE';
        display.innerText = fullCode;
        display.className = 'font-mono text-xl font-bold tracking-widest text-emerald-600 mb-6 py-2 px-4 rounded-xl w-full max-w-xs bg-emerald-50 border border-emerald-200 select-all';
        
        // Перетворюємо кнопку на дію копіювання
        btn.disabled = false;
        btn.className = 'w-full max-w-xs py-3.5 px-6 rounded-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold text-sm tracking-wide transition active:scale-95 flex items-center justify-center space-x-2 shadow-lg shadow-emerald-500/25';
        btn.innerHTML = '<i class="fa-solid fa-copy"></i><span>Copy code</span>';
        btn.onclick = () => copyCode(fullCode);
      }, 600);
    }

    function copyCode(customCode) {
      const code = customCode || document.getElementById('codeDisplay').innerText;
      const el = document.createElement('textarea');
      el.value = code;
      document.body.appendChild(el);
      el.select();
      document.execCommand('copy');
      document.body.removeChild(el);

      const toast = document.getElementById('toast');
      toast.classList.remove('-translate-y-20', 'opacity-0');
      toast.classList.add('translate-y-0', 'opacity-100');
      setTimeout(() => {
        toast.classList.add('-translate-y-20', 'opacity-0');
        toast.classList.remove('translate-y-0', 'opacity-100');
      }, 2000);
    }

    // Старт
    renderCatalog();
  </script>
</body>
</html>
